
services:
  postgres:
    image: postgres:15-alpine
    container_name: mugiko_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mugiko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/deploy/sql/setup:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mugiko"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  sequin_redis:
    image: redis:7-alpine
    container_name: mugiko_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Initialize Redis streams and consumer groups before workers start.
  redis-init:
    image: redis:7-alpine
    container_name: mugiko_redis_init
    restart: "no"
    depends_on:
      sequin_redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        create_group() {
          stream="$$1"
          group="$$2"

          echo "Initializing stream=$$stream group=$$group"

          if redis-cli -h sequin_redis XGROUP CREATE "$$stream" "$$group" 0 MKSTREAM 2>&1; then
            echo "Created group $$group on $$stream"
          else
            # Only treat BUSYGROUP as success.
            if redis-cli -h sequin_redis XINFO GROUPS "$$stream" 2>/dev/null |
              grep -q "name=$$group"; then
              echo "Group $$group already exists on $$stream"
            else
              echo "Failed to initialize $$group on $$stream"
              exit 1
            fi
          fi
        }

        # Subtitle worker
        create_group subtitle_queue subtitle-workers

        # Cache updater
        create_group chat_progress cache-updater
        create_group llm_progress cache-updater
        create_group subtitle_progress cache-updater

        # LLM worker
        create_group chat_jobs llm-workers
        create_group llm_jobs llm-workers

        echo "Redis initialization completed."

  sequin:
    image: sequin/sequin:latest
    container_name: mugiko_sequin
    restart: unless-stopped
    pull_policy: always
    ports:
      - "7376:7376"
    environment:
      - PG_HOSTNAME=postgres
      - PG_DATABASE=mugiko
      - PG_PORT=5432
      - PG_USERNAME=postgres
      - PG_PASSWORD=postgres
      - PG_POOL_SIZE=20
      - SECRET_KEY_BASE=wDPLYus0pvD6qJhKJICO4dauYPXfO/Yl782Zjtpew5qRBDp7CZvbWtQmY0eB13If
      - VAULT_KEY=2Sig69bIpuSm2kv0VQfDekET2qy8qUZGI8v3/h3ASiY=
      - REDIS_URL=redis://sequin_redis:6379
      - CONFIG_FILE_PATH=/config/playground.yml
    volumes:
      - ./scripts/deploy/playground.yml:/config/playground.yml:ro
      - ./scripts/deploy/sql/sequin:/config/sql:ro
    depends_on:
      sequin_redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: mugiko_api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_DRIVER: postgres
      DB_PATH: postgres://postgres:postgres@postgres:5432/mugiko?sslmode=disable
      PORT: "8080"
      LOG_DIR: /app/logs
      REDIS_URL: redis://sequin_redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      sequin_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: mugiko_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  subtitle-worker:
    build:
      context: ./src/workers
      dockerfile: Dockerfile
    container_name: mugiko_subtitle_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mugiko
      REDIS_URL: redis://sequin_redis:6379/0
      SUBTITLE_STREAM: subtitle_queue
      CONSUMER_GROUP: subtitle-workers
      CONSUMER_NAME: subtitle-worker-1
      READ_BLOCK_MS: "2000"
      CLAIM_IDLE_MS: "300000"
      SUBTITLE_CACHE_TTL_SECONDS: "604800"
    volumes:
      - ./src/workers/nim.txt:/app/nim.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully

  # Go cache updater: consumes progress streams, writes Redis keys (24h TTL) + Pub/Sub.
  cache-updater:
    build:
      context: ./src/cache-updater
      dockerfile: Dockerfile
    container_name: mugiko_cache_updater
    restart: unless-stopped
    environment:
      REDIS_URL: redis://sequin_redis:6379/0
      PROGRESS_STREAMS: chat_progress,llm_progress,subtitle_progress
      CONSUMER_GROUP: cache-updater
      CONSUMER_NAME: cache-updater-1
      PROGRESS_TTL_SECONDS: "86400"
    depends_on:
      redis-init:
        condition: service_completed_successfully

  # Go LLM Work Server: consumes chat/LLM job streams, calls NIM, persists results.
  llm-worker:
    build:
      context: ./src/llm-worker
      dockerfile: Dockerfile
    container_name: mugiko_llm_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mugiko?sslmode=disable
      REDIS_URL: redis://sequin_redis:6379/0
      CONSUMER_GROUP: llm-workers
      CONSUMER_NAME: llm-worker-1
      LLM_CHAT_JOBS_STREAM: chat_jobs
      LLM_JOBS_STREAM: llm_jobs
      PROGRESS_TTL_SECONDS: "86400"
      NVIDIA_API_KEYS_FILE: /app/nim.txt
      NVIDIA_NIM_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_NIM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      NVIDIA_NIM_TEMPERATURE: "0.2"
      NVIDIA_NIM_MAX_TOKENS: "4096"
      NVIDIA_NIM_TIMEOUT_SECONDS: "120"
      LLM_READ_BLOCK_MS: "5000"
      LLM_CLAIM_IDLE_MS: "300000"
      LLM_POLL_INTERVAL_MS: "2000"
    volumes:
      - ./src/workers/nim.txt:/app/nim.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
