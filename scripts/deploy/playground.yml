databases:
  - name: mugiko
    port: 5432
    slot:
      name: sequin_slot
    ssl: false
    ipv6: false
    hostname: mugiko_postgres
    password:
      postgres
    username: postgres
    pool_size: 10
    database: mugiko
    use_local_tunnel: false
    publication:
      name: sequin_pub
functions:
  - file: "/config/sql/subtitle_enrich.sql"
    name: add-provider
    type: enrichment
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        enrichment = metadata[:enrichment] || metadata["enrichment"] || %{}

        %{
          id: record["id"],
          video_url: record["video_url"],
          service: enrichment["service"] || enrichment[:service],
          provider: enrichment["provider"] || enrichment[:provider]
        }
      end
    name: keep-neccessary
    type: transform
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        %{
          id: record["id"],
          conversation_id: record["conversation_id"],
          role: record["role"],
          content: record["content"],
          status: record["status"],
          entity_type: "chat",
          entity_id: record["id"]
        }
      end
    name: chat-job-transform
    type: transform
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        %{
          id: record["id"],
          prompt: record["prompt"],
          status: record["status"],
          error: record["error"],
          created_by: record["created_by"],
          entity_type: "llm",
          entity_id: record["id"]
        }
      end
    name: llm-job-transform
    type: transform
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        %{
          id: record["id"],
          status: record["status"],
          error: record["error"],
          entity_type: "subtitle",
          entity_id: record["id"]
        }
      end
    name: subtitle-progress-transform
    type: transform
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        %{
          id: record["id"],
          image_url: record["image_url"],
          status: record["status"],
          entity_type: "ocr",
          entity_id: record["id"]
        }
      end
    name: ocr-job-transform
    type: transform
    description: ""
  - code: |
      def transform(action, record, changes, metadata) do
        %{
          id: record["id"],
          status: record["status"],
          error: record["error"],
          entity_type: "ocr",
          entity_id: record["id"]
        }
      end
    name: ocr-progress-transform
    type: transform
    description: ""
sinks:
  - name: mugiko-subtitle-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.subtitles
    transform: keep-neccessary
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: subtitle_queue
    actions:
      - insert
    batch_size: 50
    database: mugiko
    annotations: {}
    enrichment: add-provider
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  # Chat job queue: user messages inserted with status=queued feed the LLM Work Server.
  - name: mugiko-chat-jobs-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.messages
    transform: chat-job-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: chat_jobs
    actions:
      - insert
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  # LLM job queue: llm_jobs rows feed the LLM Work Server (legacy path).
  - name: mugiko-llm-jobs-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.llm_jobs
    transform: llm-job-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: llm_jobs
    actions:
      - insert
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  # Progress streams consumed by the Go cache updater (SET EX + PUBLISH per event).
  - name: mugiko-chat-progress-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.messages
    transform: chat-job-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: chat_progress
    actions:
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  - name: mugiko-llm-progress-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.llm_jobs
    transform: llm-job-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: llm_progress
    actions:
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  - name: mugiko-subtitle-progress-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.subtitles
    transform: subtitle-progress-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: subtitle_progress
    actions:
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  # OCR job queue: new ocr_results rows feed the OCR worker.
  - name: mugiko-ocr-jobs-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.ocr_results
    transform: ocr-job-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: ocr_jobs
    actions:
      - insert
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

  # OCR progress stream: status updates on ocr_results feed the cache updater.
  - name: mugiko-ocr-progress-sink
    status: active
    filter: none
    tables: []
    source:
      include_tables:
        - public.ocr_results
    transform: ocr-progress-transform
    destination:
      port: 6379
      type: redis_stream
      host: sequin_redis
      tls: false
      database: 0
      stream_key: ocr_progress
    actions:
      - update
    batch_size: 50
    database: mugiko
    annotations: {}
    timestamp_format: iso8601
    message_grouping: true
    max_retry_count: null
    load_shedding_policy: pause_on_full
    active_backfills: []
    routing: none

