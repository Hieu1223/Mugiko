# Sequin configuration for Mugiko LLM Conversation
# Watches conversations and messages tables, publishes to Redis streams

account:
  name: mugiko
  email: admin@mugiko.local
  password: admin

databases:
  - name: mugiko
    hostname: postgres
    port: 5432
    username: postgres
    password: postgres
    database: mugiko
    publication:
      name: sequin_pub
    slot:
      name: sequin_slot
    ssl: false

tables:
  - name: conversations
    schema: public
    primary_keys: [id]
    columns:
      - id
      - user_id
      - title
      - created_at
      - updated_at
    stream:
      name: conversation_changes
      keys: [id]

  - name: messages
    schema: public
    primary_keys: [id]
    columns:
      - id
      - conversation_id
      - role
      - content
      - metadata
      - created_at
    stream:
      name: conversation_messages
      keys: [conversation_id]

  - name: llm_jobs
    schema: public
    primary_keys: [id]
    columns:
      - id
      - user_id
      - conversation_id
      - model
      - prompt
      - status
      - response
      - error
      - created_at
      - updated_at
    stream:
      name: llm_jobs
      keys: [id]

redis:
  url: redis://redis:6379

sink_consumers:
  - name: conversation_changes_sink
    type: redis_stream
    sink:
      host: redis
      port: 6379
      stream_key: conversation_changes
    actions: ["insert", "update", "delete"]
    source:
      include_table_oids: [25756]

  - name: conversation_messages_sink
    type: redis_stream
    sink:
      host: redis
      port: 6379
      stream_key: conversation_messages
    actions: ["insert", "update", "delete"]
    source:
      include_table_oids: [25773]

  - name: llm_jobs_sink
    type: redis_stream
    sink:
      host: redis
      port: 6379
      stream_key: llm_jobs
    actions: ["insert", "update", "delete"]
    source:
      include_table_oids: [25774]